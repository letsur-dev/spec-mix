name: Release spec-simple

on:
  push:
    tags:
      - "spec-simple/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#spec-simple/}" >> "$GITHUB_OUTPUT"

      - name: Create local version tag for GoReleaser
        run: git tag -f "${{ steps.tag.outputs.version }}" HEAD

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          distribution: goreleaser
          args: release --clean
          workdir: packages/spec-simple
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.version }}

      - name: Remove source code archives from release
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          gh release delete-asset "$VERSION" "$VERSION.tar.gz" --repo letsur-dev/homebrew-tap --yes 2>/dev/null || true
          gh release delete-asset "$VERSION" "$VERSION.zip" --repo letsur-dev/homebrew-tap --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
